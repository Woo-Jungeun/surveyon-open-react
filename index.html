<!doctype html>
<html translate="no">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설문온</title>
    <script>
        // 전역 예외 처리: 외부/라이브러리 startTime 참조 에러 콘솔 억제
        window.addEventListener('error', function (e) {
            if (e && e.message && e.message.includes("startTime")) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
        });
    </script>
</head>

<body>
    <div id="root"></div>
    <!-- Runtime Configuration -->
    <script src="/config.js"></script>
    <!-- Chrome unload Violation Suppression -->
    <script>
        (function () {
            var _orig = window.addEventListener;
            window.addEventListener = function (type, listener, options) {
                if (type === 'unload') {
                    return _orig.call(this, 'pagehide', listener, options);
                }
                return _orig.call(this, type, listener, options);
            };
        })();
    </script>
    <!-- jQuery -->
    <script src="/Scripts/jquery-3.7.1.min.js"></script>
    <!-- SignalR 2.x (jQuery용) -->
    <script src="/Scripts/jquery.signalR-2.4.3.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
